{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if editando else 'Nueva' }} empresa{% endblock %}
{% block contenido %}
<h1>{{ 'Editar empresa' if editando else 'Nueva empresa' }}</h1>
<form method="post" class="tarjeta">
  <div class="grilla2">
    <div class="campo"><label>Nombre *</label><input name="nombre" value="{{ empresa.nombre or '' }}" required autofocus></div>
    <div class="campo"><label>CUIT</label><input name="cuit" value="{{ empresa.cuit or '' }}"></div>
    <div class="campo"><label>Persona de contacto</label><input name="contacto" value="{{ empresa.contacto or '' }}"></div>
    <div class="campo"><label>Teléfono</label><input name="telefono" value="{{ empresa.telefono or '' }}"></div>
  </div>
  {% if editando %}
  <label class="check campo"><input type="checkbox" name="activa" value="1" {{ 'checked' if empresa.activa }}> Activa (si la desactivás, no aparece para cargar remitos nuevos, pero se conserva su historial)</label>
  {% endif %}
  <button class="boton">Guardar</button>
  <a class="boton secundario" href="{{ url_for('stock.empresas') }}">Cancelar</a>
</form>
{% endblock %}
